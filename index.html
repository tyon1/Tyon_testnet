<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tyon Serialization: Sandbox Testnet Demo">
  <title>Tyon | Testnet Sandbox</title>
  <link rel="stylesheet" href="Test_style.css">
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
  </script>
</head>
<body>

  <!-- Testnet Banner -->
  <div id="testnetBanner">TESTNET MODE — Sandbox Environment</div>

  <!-- Header -->
  <header id="header">
    <img src="logo.png" alt="Tyon Logo" id="logo">
    <h1>Tyon Serialization (Testnet)</h1>
  </header>

  <!-- Main App -->
  <div id="tyonApp" class="fade-in" role="main">

    <!-- STEP 1: Identity -->
    <section id="identityScreen" class="screen active">
      <h2 class="header-glow">Identify Yourself</h2>
      <form id="identityForm">
        <div class="input-group">
          <label for="userName">Name</label>
          <input type="text" id="userName" placeholder="Enter your full name" required>
        </div>
        <div class="input-group">
          <label for="companyName">Company</label>
          <input type="text" id="companyName" placeholder="Enter company name" required>
        </div>
        <button id="proceedBtn" type="submit" disabled>Proceed</button>
      </form>
    </section>

    <!-- STEP 2: Upload -->
    <section id="uploadScreen" class="screen hidden">
      <h2 class="header-glow">Upload Your Document</h2>

      <!-- Upload Toggle -->
      <div class="upload-toggle">
        <button id="singleBtn" class="active" aria-pressed="true">Single Upload</button>
        <button id="bulkBtn" aria-pressed="false">Bulk Upload</button>
      </div>

      <!-- Single Upload -->
      <form id="singleForm" class="upload-form">
        <fieldset>
          <legend>PDF Selection</legend>
          <input type="file" id="pdfFile" accept="application/pdf">
          <input type="text" id="filename" readonly placeholder="Filename will appear here">
          <input type="number" id="pageCount" readonly placeholder="Page count">
        </fieldset>

        <fieldset>
          <legend>Metadata</legend>
          <label for="memo">Memo:</label>
          <input type="text" id="memo" placeholder="Enter a brief memo">
        </fieldset>

        <div class="button-group">
          <button type="button" id="encryptBtn" class="btn-action" disabled>Encrypt</button>
          <button type="button" id="decryptBtn" class="btn-action" disabled>Decrypt</button>
          <button type="button" id="obfuscateBtn" class="btn-action" disabled>Obfuscate</button>
          <button type="button" id="maskBtn" class="btn-action" disabled>Mask</button>
          <button type="button" id="copyBtn" class="btn-action" disabled>Copy</button>
        </div>

        <button type="submit" id="submitBtn">Submit</button>
      </form>

      <!-- Bulk Upload (optional) -->
      <form id="bulkForm" class="upload-form hidden">
        <fieldset>
          <legend>Bulk CSV Upload</legend>
          <input type="file" id="csvFile" accept=".csv">
          <button type="button" id="bulkSubmitBtn">Submit CSV</button>
        </fieldset>
      </form>

      <!-- Results -->
      <div id="resultsBox" class="hidden">
        <h3>Document Metadata</h3>
        <p><strong>Filename:</strong> <span id="tyonId"></span></p>
        <p><strong>Pages:</strong> <span id="timestamp"></span></p>
        <p><a id="hashscanLink" target="_blank">View on HashScan</a></p>
        <p><a id="stampedPdfLink" download>Download Stamped PDF</a></p>
      </div>
    </section>

  </div>

  <!-- Sandbox Logic -->
  <script src="Test_script.js"></script>
</body>
</html>
